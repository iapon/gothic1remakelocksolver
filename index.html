<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock Pick Solver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.3); }
.container { max-width: 1200px; margin: 0 auto; }
.panel { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.panel h2 { color: #00d4ff; margin-bottom: 15px; font-size: 1.1em; }

.config-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.config-row label { min-width: 50px; color: #8ecae6; display: flex; align-items: center; }
.config-row select, .config-row input { background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 14px; }
.config-row input[type="number"] { width: 70px; }

.btn { background: linear-gradient(135deg, #0f3460, #1a4a7a); border: 1px solid #00d4ff; color: #00d4ff; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
.btn:hover { background: linear-gradient(135deg, #1a4a7a, #2a6aaa); box-shadow: 0 0 15px rgba(0,212,255,0.3); }
.btn-danger { border-color: #e74c3c; color: #e74c3c; }
.btn-danger:hover { background: linear-gradient(135deg, #2a1a1a, #4a2a2a); box-shadow: 0 0 15px rgba(231,76,60,0.3); }
.btn-sm { padding: 4px 12px; font-size: 12px; }

.plate-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.plate-row { display: flex; align-items: center; gap: 10px; background: #0f3460; padding: 10px; border-radius: 8px; flex-wrap: wrap; }
.plate-row .plate-name { font-weight: bold; color: #ffd700; min-width: 70px; }
.effect-item { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.effect-item select { background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
.effect-item .remove-eff { color: #e74c3c; cursor: pointer; font-weight: bold; padding: 0 4px; }
.effect-item .remove-eff:hover { color: #ff6b6b; }

.plate-visual { display: flex; gap: 4px; margin: 5px 0; align-items: center; }
.plate-visual .slot { width: 32px; height: 32px; border-radius: 4px; background: #1a1a2e; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555; position: relative; }
.plate-visual .slot.center { border-color: #ffd700; }
.plate-visual .slot.has-pin { background: #00d4ff; color: #000; font-weight: bold; box-shadow: 0 0 8px rgba(0,212,255,0.5); }
.plate-visual .plate-label { min-width: 65px; color: #ffd700; font-weight: bold; font-size: 14px; }

.solution-box { background: #0f3460; border-radius: 8px; padding: 15px; margin-top: 10px; max-height: 500px; overflow-y: auto; }
.move-item { padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.move-item .move-num { color: #888; min-width: 35px; }
.move-item .move-desc { color: #e0e0e0; }
.move-item.current { background: rgba(0,212,255,0.15); border-radius: 6px; }
.move-item.done { opacity: 0.4; }
.status { padding: 10px 15px; border-radius: 8px; margin: 10px 0; font-weight: 600; text-align: center; }
.status.idle { background: #1a1a2e; color: #888; }
.status.solving { background: #2a2a1a; color: #ffd700; }
.status.found { background: #0a3a0a; color: #0f0; }
.status.error { background: #3a0a0a; color: #f44; }
.status.nosolution { background: #3a2a0a; color: #fa0; }

.controls { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }

.btn-group { display: flex; gap: 4px; }
.btn-dir { padding: 4px 10px; font-size: 12px; min-width: 35px; }

.toast { position: fixed; bottom: 20px; right: 20px; background: #0f3460; border: 1px solid #00d4ff; color: #e0e0e0; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 999; font-size: 14px; display: none; }

.step-counter { color: #00d4ff; font-weight: bold; font-size: 15px; padding: 0 8px; min-width: 60px; text-align: center; }
.step-move { color: #ffd700; font-size: 14px; font-weight: 600; min-width: 140px; }

.speed-select { background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; padding: 4px 8px; border-radius: 6px; font-size: 12px; }

.preset-box { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.preset-btn { background: #0f3460; border: 1px solid #333; color: #8ecae6; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.preset-btn:hover { border-color: #00d4ff; color: #00d4ff; }

.recipe-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
.recipe-box label { color: #8ecae6; font-size: 13px; }
.recipe-box input[type="text"] { background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 13px; width: 180px; }
.recipe-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.recipe-item { display: flex; align-items: center; gap: 6px; background: #0f3460; border: 1px solid #1a4a7a; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.recipe-item:hover { border-color: #00d4ff; }
.recipe-item .recipe-name { color: #8ecae6; }
.recipe-item .recipe-del { color: #e74c3c; font-weight: bold; padding: 0 2px; }
.recipe-item .recipe-del:hover { color: #ff6b6b; }

.pin-input { width: 50px; text-align: center; font-size: 16px; padding: 8px; background: #0f3460; border: 2px solid #1a4a7a; color: #ffd700; border-radius: 8px; font-weight: bold; }

.plate-pins-config { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.plate-pins-config span { font-size: 12px; color: #8ecae6; }

.move-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
.move-row.current { background: rgba(0,212,255,0.15); border-radius: 6px; }
.move-row.done { opacity: 0.4; }
.move-row .move-num { color: #888; min-width: 30px; text-align: right; }
.move-row .move-desc { color: #8ecae6; min-width: 130px; }
.move-row .mini-plates { display: flex; gap: 6px; }
.mini-plate { display: flex; gap: 1px; padding: 2px 3px; border-radius: 3px; background: rgba(0,0,0,0.25); }
.mini-slot { width: 8px; height: 8px; border-radius: 2px; background: #222; }
.mini-slot.center-slot { outline: 1px solid #ffd70055; }
.mini-slot.has-pin { background: #00d4ff; box-shadow: 0 0 4px #00d4ff; }
.mini-slot.has-pin.center-slot { background: #0f0; box-shadow: 0 0 4px #0f0; }
.mini-plate-label { font-size: 9px; color: #888; margin-right: 2px; align-self: center; }

.search-wrap { position: relative; display: inline-block; }
.search-input { background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; padding: 6px 10px 6px 28px; border-radius: 6px; font-size: 13px; width: 220px; }
.search-input:focus { outline: none; border-color: #00d4ff; }
.search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: #8ecae6; font-size: 12px; pointer-events: none; }
.search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #0f3460; border: 1px solid #1a4a7a; border-radius: 0 0 8px 8px; max-height: 260px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.search-dropdown.open { display: block; }
.search-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
.search-item:hover { background: #1a4a7a; }
.search-item:last-child { border-bottom: none; }
.search-item .si-name { color: #e0e0e0; }
.search-item .si-info { color: #555; font-size: 11px; }
.search-item .si-del { color: #e74c3c; font-size: 14px; padding: 0 4px; margin-left: 8px; }
.search-item .si-del:hover { color: #ff6b6b; }
.search-empty { padding: 12px; text-align: center; color: #555; font-size: 12px; }
</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div class="container">
  <h1>&#128274; Lock Pick Solver</h1>

  <div class="panel">
    <h2>&#9881; Configuration</h2>
    <div class="config-row">
      <label>Plates:</label>
      <select id="numPlates" onchange="rebuildConfig()">
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
      <button class="btn btn-sm btn-danger" onclick="resetAll()">Reset All</button>
    </div>
    <div class="recipe-box">
      <label>Recipe:</label>
      <input type="text" id="recipeName" placeholder="Recipe name..." onkeydown="if(event.key==='Enter')saveRecipe()">
      <button class="btn btn-sm" onclick="saveRecipe()">Save</button>
      <button class="btn btn-sm" onclick="submitToCommunity()" style="border-color:#0f0;color:#0f0;">&#127760; Share</button>
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" id="recipeSearch" placeholder="Search local..." oninput="filterRecipes()" onfocus="openDropdown()" onclick="event.stopPropagation()">
        <div class="search-dropdown" id="recipeDropdown"></div>
      </div>
      <button class="btn btn-sm" onclick="exportRecipe()">&#11015; Download</button>
      <label class="btn btn-sm" style="cursor:pointer;">&#11014; Upload<input type="file" id="fileInput" accept=".json" style="display:none" onchange="importRecipe(event)"></label>
      <span style="color:#444;">|</span>
      <button class="btn btn-sm" onclick="exportAllRecipes()">&#11015; All</button>
      <label class="btn btn-sm" style="cursor:pointer;">&#11014; All<input type="file" id="fileInputAll" accept=".json" style="display:none" onchange="importAllRecipes(event)"></label>
    </div>
    <div class="recipe-box" style="border-top:1px solid rgba(255,255,255,0.08);margin-top:8px;padding-top:8px;">
      <label style="color:#0f0;">&#127760; Community:</label>
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" id="communitySearch" placeholder="Search community..." oninput="filterCommunity()" onfocus="openCommunityDropdown()" onclick="event.stopPropagation()">
        <div class="search-dropdown" id="communityDropdown"></div>
      </div>
      <button class="btn btn-sm" onclick="loadCommunity()">&#8635; Refresh</button>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;align-items:center;gap:12px;">
      <h2 style="margin:0;">&#128260; Plates</h2>
      <span id="currentRecipeName" style="color:#ffd700;font-size:14px;font-weight:600;"></span>
    </div>
    <div id="plateConfig" class="plate-list"></div>
  </div>

  <div class="panel">
    <h2>&#128269; Solve</h2>
    <div class="controls">
      <button class="btn" onclick="solve()">&#9654; Find Solution</button>
      <button class="btn" onclick="resetToInitial()">&#8634; Reset to Initial</button>
      <button class="btn" id="autoPlayBtn" onclick="toggleAutoPlay()">&#9658; Auto Play</button>
      <label style="color:#8ecae6;font-size:12px;">Speed:</label>
      <select id="autoSpeed" class="speed-select" onchange="updateSpeed()">
        <option value="3000">0.25x</option>
        <option value="2000">0.5x</option>
        <option value="1200" selected>1x</option>
        <option value="600">2x</option>
        <option value="300">4x</option>
      </select>
      <button class="btn" onclick="stepBack()">&#9664;</button>
      <span id="stepCounter" class="step-counter">— / —</span>
      <span id="stepMove" class="step-move"></span>
      <button class="btn" onclick="stepForward()">&#9654;</button>
    </div>
    <div id="status" class="status idle">Ready</div>
    <div id="plateVisual"></div>
    <div id="solutionBox" class="solution-box" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyABGjHFV-5lgA6A-c_XuKmqN6ZpR0VyASo",
  authDomain: "gothic-1-remake-lockpiker.firebaseapp.com",
  projectId: "gothic-1-remake-lockpiker",
  storageBucket: "gothic-1-remake-lockpiker.firebasestorage.app",
  messagingSenderId: "970434471850",
  appId: "1:970434471850:web:4457e60a28304337b5add3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let communityRecipes = [];

let numPlates = 6;
let numPositions = 7;
let center = 3;
let plates = []; // [{initPin, effects: [{target, dir}]}]
let currentPins = [];
let solution = null;
let stepIndex = 0;
let autoPlayId = null;

function rebuildConfig() {
  numPlates = parseInt(document.getElementById('numPlates').value);
  numPositions = 7;
  center = 3;

  // Preserve existing config if possible
  let old = plates;
  plates = [];
  for (let i = 0; i < numPlates; i++) {
    if (old[i]) {
      plates.push({initPin: old[i].initPin, effects: old[i].effects.filter(e => e.target < numPlates)});
    } else {
      plates.push({initPin: center, effects: []});
    }
  }
  currentPins = plates.map(p => p.initPin);
  renderConfig();
  renderVisual();
  solution = null;
  document.getElementById('solutionBox').style.display = 'none';
  showRecipeName('');
  setStatus('idle', 'Ready');
}

function showRecipeName(name) {
  document.getElementById('currentRecipeName').textContent = name ? `\u2022 ${name}` : '';
}

function deleteRecipe(name) {
function showRecipeName(name) {
  document.getElementById('currentRecipeName').textContent = name ? `\u2022 ${name}` : '';
}
  event.stopPropagation();
  const recipes = getRecipes();
  delete recipes[name];
  saveRecipes(recipes);
  renderRecipeList();
  showToast(`Deleted: ${name}`);
}

function renderRecipeList() {
  filterRecipes();
}

function filterRecipes() {
  const dropdown = document.getElementById('recipeDropdown');
  const query = document.getElementById('recipeSearch').value.toLowerCase();
  const recipes = getRecipes();
  const names = Object.keys(recipes).sort();
  const filtered = names.filter(n => n.toLowerCase().includes(query));

  dropdown.innerHTML = '';
  if (filtered.length === 0) {
    dropdown.innerHTML = '<div class="search-empty">' + (names.length === 0 ? 'No saved recipes' : 'No matches') + '</div>';
  } else {
    for (const name of filtered) {
      const r = recipes[name];
      const info = `${r.numPlates}P / ${r.numPositions}pos`;
      const item = document.createElement('div');
      item.className = 'search-item';
      const safe = name.replace(/'/g, "\\'");
      item.innerHTML = `<span class="si-name" onclick="loadRecipe('${safe}');closeDropdown()">${name}</span><span class="si-info">${info}</span><span class="si-del" onclick="event.stopPropagation();deleteRecipe('${safe}')">&#10006;</span>`;
      dropdown.appendChild(item);
    }
  }
}

function openDropdown() {
  document.getElementById('recipeDropdown').classList.add('open');
}

function closeDropdown() {
  document.getElementById('recipeDropdown').classList.remove('open');
  document.getElementById('recipeSearch').value = '';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeDropdown();
});

function exportRecipe() {
  const name = document.getElementById('recipeName').value.trim() || 'lock_recipe';
  const data = {
    name,
    numPlates, numPositions, center,
    plates: plates.map(p => ({initPin: p.initPin, effects: p.effects.map(e => ({...e}))}))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importRecipe(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      numPlates = data.numPlates;
      numPositions = data.numPositions || 7;
      center = data.center !== undefined ? data.center : 3;
      document.getElementById('numPlates').value = numPlates;
      plates = data.plates.map(p => ({initPin: p.initPin, effects: p.effects.map(e2 => ({...e2}))}));
      currentPins = plates.map(p => p.initPin);
      renderConfig();
      renderVisual();
      solution = null;
      solutionStates = [];
      document.getElementById('solutionBox').style.display = 'none';
      if (data.name) document.getElementById('recipeName').value = data.name;
      showRecipeName(data.name);
      setStatus('idle', `Imported: ${data.name || file.name}`);
    } catch(err) {
      showToast('Invalid file');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function exportAllRecipes() {
  const recipes = getRecipes();
  const names = Object.keys(recipes);
  if (names.length === 0) { showToast('No recipes to export'); return; }
  const blob = new Blob([JSON.stringify(recipes, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'all_recipes.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importAllRecipes(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const recipes = getRecipes();
      let count = 0;
      for (const [name, recipe] of Object.entries(data)) {
        if (recipe.numPlates && recipe.plates) {
          recipes[name] = recipe;
          count++;
        }
      }
      saveRecipes(recipes);
      renderRecipeList();
      showToast(`Imported ${count} recipes`);
    } catch(err) {
      showToast('Invalid file');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function resetAll() {
  if (!confirm('Reset all settings to defaults?')) return;
  loadPreset();
  renderRecipeList();
}

// Init
loadPreset();
renderRecipeList();
loadCommunity();

// ---- Community (Firebase) ----
async function loadCommunity() {
  try {
    const snap = await db.collection('recipes').orderBy('createdAt', 'desc').get();
    communityRecipes = snap.docs.map(d => ({id: d.id, ...d.data()}));
    filterCommunity();
  } catch(e) {
    console.error('Community load error', e);
  }
}

async function submitToCommunity() {
  const name = document.getElementById('recipeName').value.trim();
  if (!name) { showToast('Enter a recipe name first'); return; }

  const existing = communityRecipes.find(r => r.name.toLowerCase() === name.toLowerCase());
  if (existing) { showToast(`"${name}" already exists in community`); return; }

  const data = {
    name,
    numPlates, numPositions, center,
    plates: plates.map(p => ({initPin: p.initPin, effects: p.effects.map(e => ({...e}))})),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('recipes').add(data);
    showToast(`Shared: ${name}`);
    loadCommunity();
  } catch(e) {
    showToast('Error sharing recipe');
    console.error(e);
  }
}

function filterCommunity() {
  const dropdown = document.getElementById('communityDropdown');
  const query = document.getElementById('communitySearch').value.toLowerCase();
  const filtered = communityRecipes.filter(r => r.name.toLowerCase().includes(query));

  dropdown.innerHTML = '';
  if (filtered.length === 0) {
    dropdown.innerHTML = '<div class="search-empty">' + (communityRecipes.length === 0 ? 'No community recipes yet' : 'No matches') + '</div>';
  } else {
    for (const r of filtered) {
      const item = document.createElement('div');
      item.className = 'search-item';
      const info = `${r.numPlates}P / ${r.numPositions}pos`;
      const safe = (r.name || '').replace(/'/g, "\\'");
      const rid = r.id;
      item.innerHTML = `<span class="si-name" onclick="loadCommunityRecipe('${rid}')">${r.name}</span><span class="si-info">${info}</span>`;
      dropdown.appendChild(item);
    }
  }
}

function loadCommunityRecipe(id) {
  const r = communityRecipes.find(x => x.id === id);
  if (!r) return;
  numPlates = r.numPlates;
  numPositions = r.numPositions;
  center = r.center;
  document.getElementById('numPlates').value = numPlates;
  plates = r.plates.map(p => ({initPin: p.initPin, effects: p.effects.map(e => ({...e}))}));
  currentPins = plates.map(p => p.initPin);
  renderConfig();
  renderVisual();
  solution = null;
  solutionStates = [];
  document.getElementById('solutionBox').style.display = 'none';
  if (r.name) document.getElementById('recipeName').value = r.name;
  showRecipeName(r.name);
  closeCommunityDropdown();
}

function openCommunityDropdown() {
  document.getElementById('communityDropdown').classList.add('open');
}

function closeCommunityDropdown() {
  document.getElementById('communityDropdown').classList.remove('open');
  document.getElementById('communitySearch').value = '';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    closeDropdown();
    closeCommunityDropdown();
  }
});
</script>
</body>
</html>
